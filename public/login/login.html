  <!-- Header -->
  <header class="topbar">
    <div class="topbar__inner">
      <img src="/assets/dibujo.svg" alt="TechFind Logo" class="logo-img">
      <div class="brand">TechFind</div>
      <div class="topbar__actions">
        <span class="material-symbols-outlined icon-help">help_outline</span>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main class="main">
    <div class="card">

      <!-- Brand & Heading -->
      <div class="card__header">
        <div class="card__brand">TechFind</div>
        <h1 class="card__title">Login to your account</h1>
        <p class="card__subtitle">Enter your credentials to access the technical database.</p>
      </div>

      <!-- Form -->
      <form class="form" id="login-form">
        <div class="field">
          <label class="field__label" for="email">Email Address</label>
          <input class="field__input" id="email" type="email" placeholder="user@techfind.io" autocomplete="email"
            required />
        </div>

        <div class="field">
          <label class="field__label" for="password">Password</label>
          <input class="field__input" id="password" type="password" placeholder="••••••••"
            autocomplete="current-password" required />
        </div>

        <div class="form__submit">
          <button type="submit" class="btn-primary">Sign In</button>
        </div>

        <div class="form__divider">
          <span>OR</span>
        </div>

        <button type="button" class="btn-google" id="google-login">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="" width="18">
          <span>Continue with Google</span>
        </button>
      </form>

      <!-- Links -->
      <div class="card__links">
        <a href="#" class="link" id="forgot-password-link">Forgot password?</a>
        <a href="register.html" class="link">Create an account</a>
      </div>

    </div>
  </main>

  <script type="module" src="auth.js"></script>
