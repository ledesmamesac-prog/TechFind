<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechFind — Productos</title>
  <meta name="description" content="Explora y compara todos los productos de Éxito y Alkosto.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,300&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- TOPBAR -->
  <header class="topbar">
    <div class="topbar-logo">
      <a href="index.html" style="display:flex;align-items:center;gap:8px;text-decoration:none;color:inherit">
        <span class="logo-mark">T</span>
        <span class="logo-text">TechFind</span>
      </a>
    </div>
    <nav class="topbar-nav">
      <a href="index.html" class="nav-link">Inicio</a>
      <a href="category.html" class="nav-link active">Todos los productos</a>
    </nav>
    <div class="topbar-search">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
        <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.5" />
        <path d="M11 11l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
      </svg>
      <input type="text" id="search-input" placeholder="Buscar por nombre, marca, tienda...">
      <span id="results-count" class="results-count"></span>
    </div>
    <div class="topbar-actions">
      <select id="sort-select">
        <option value="price-asc">Precio: menor a mayor</option>
        <option value="price-desc">Precio: mayor a menor</option>
        <option value="name-asc">Nombre A–Z</option>
      </select>
    </div>
  </header>

  <div class="app-body">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="back-link-wrap">
        <a href="index.html" class="back-link">← Inicio</a>
      </div>
      <div class="filter-group">
        <div class="filter-label">Categoría</div>
        <div class="chip-group" id="filter-category"></div>
      </div>
      <div class="filter-group">
        <div class="filter-label">Tienda</div>
        <div class="chip-group" id="filter-store"></div>
      </div>
      <div class="filter-group">
        <div class="filter-label">Marca</div>
        <div class="chip-group" id="filter-brand"></div>
      </div>
      <div class="filter-group">
        <div class="filter-label">Ofertas</div>
        <label class="toggle-wrap">
          <input type="checkbox" id="filter-discount">
          <span class="toggle-label">Solo con descuento</span>
        </label>
      </div>
      <div class="filter-group">
        <div class="filter-label">Rangos rápidos</div>
        <div class="quick-prices">
          <button class="price-chip" data-max="1000000"><$1M</button>
          <button class="price-chip" data-min="1000000" data-max="3000000">$1M - $3M</button>
          <button class="price-chip" data-min="3000000">$3M+</button>
        </div>
      </div>
      <div class="filter-group">
        <div class="filter-label">Precio máximo</div>
        <div class="price-wrap">
          <input type="range" id="price-range" min="0" max="10000" value="10000" step="100">
          <div class="price-display">
            <span>$0</span>
            <span id="price-val" class="mono">$10,000</span>
          </div>
        </div>
      </div>
      <div class="filter-group">
        <button id="clear-filters" class="clear-btn">Limpiar filtros</button>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="main">
      <!-- Category title bar (shown when filtered) -->
      <div class="cat-title-bar" id="cat-title-bar" style="display:none">
        <span class="cat-title-icon" id="cat-title-icon"></span>
        <span class="cat-title-name" id="cat-title-name"></span>
        <span class="cat-title-count" id="cat-title-count"></span>
      </div>

      <!-- Compare bar -->
      <div class="compare-bar" id="compare-bar" style="display:none">
        <span class="compare-label">Comparando:</span>
        <div class="compare-items" id="compare-items"></div>
        <button class="compare-action" id="compare-action">Ver comparación →</button>
        <button class="compare-clear" id="compare-clear">✕</button>
      </div>

      <div class="product-grid" id="product-grid">
        <div class="loading-state" id="loading-state">
          <div class="loading-dots"><span></span><span></span><span></span></div>
          <p>Cargando productos...</p>
        </div>
      </div>

      <div class="empty-state" id="empty-state" style="display:none">
        <p>No se encontraron productos con estos filtros.</p>
      </div>
    </main>
  </div>

  <!-- Compare modal -->
  <div class="modal-overlay" id="modal-overlay" style="display:none"></div>
  <div class="compare-modal" id="compare-modal" style="display:none">
    <div class="compare-modal-inner">
      <div class="compare-modal-header">
        <h2>Comparación de productos</h2>
        <button class="modal-close" id="modal-close">✕</button>
      </div>
      <div class="compare-table-wrap" id="compare-table-wrap"></div>
    </div>
  </div>

  <script src="icons.js"></script>
  <script src="category.js"></script>
</body>

</html>
